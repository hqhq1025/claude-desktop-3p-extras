; supervisord program for hosts without systemd (for example, containers).
; Add to your supervisord config, then run: supervisorctl reread && supervisorctl update
; The first command re-adds the hosts entry because some containers reset
; /etc/hosts on restart.
[program:local-gw-tls]
command=/bin/sh -c 'grep -q " local-gw$" /etc/hosts || echo "127.0.0.1 local-gw" >> /etc/hosts; exec /usr/bin/python3 -I /opt/local-gw/tls_forward.py 3443 3425 /opt/local-gw/server.pem /opt/local-gw/server.key'
autostart=true
autorestart=true
startsecs=2
redirect_stderr=true
stdout_logfile=/opt/local-gw/tls_forward.log
